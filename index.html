<style>
:root{--panel:#fff;--ink:#1c2631;--sub:#5b6875;--line:#d3dae1;--es:#1f8a70;--jh:#3a4fb8;--hit:#e09b00;--hitink:#7a5400}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font-family:"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;color:var(--ink);font-size:15px;line-height:1.6;display:grid;grid-template-columns:320px 1fr;padding-bottom:env(safe-area-inset-bottom,0px)}
aside{background:var(--panel);border-right:1px solid var(--line);padding:20px 18px;overflow:auto;padding-top:calc(20px + env(safe-area-inset-top,0px))}
#map{height:100%}
h1{font-size:21px;margin:0 0 4px}
.lead{color:var(--sub);font-size:13.5px;margin:0 0 16px}
.school{display:flex;align-items:center;gap:10px;padding:9px 12px;border:1px solid var(--line);border-radius:10px;margin-bottom:8px;cursor:pointer}
.school input{width:18px;height:18px}
.sw{width:14px;height:14px;border-radius:3px}
.grp{font-size:13px;color:var(--sub);margin:10px 0 6px}
h2{font-size:14px;margin:16px 0 6px}
ul{list-style:none;margin:0;padding:0}
li{padding:8px 0;border-top:1px solid var(--line);cursor:pointer}
li:last-child{border-bottom:1px solid var(--line)}
.tag{font-size:12px;padding:0 7px;border-radius:999px;margin-left:6px}
.full{background:var(--hit);color:#1c1400}.part{border:1.5px dashed var(--hit);color:var(--hitink)}
.st{width:100%;border-collapse:collapse;font-size:13px;margin-bottom:6px}.st th,.st td{padding:4px 2px;border-bottom:1px solid var(--line);text-align:right}.st th:first-child,.st td:first-child{text-align:left}.st caption{text-align:left;font-weight:700;padding:4px 0}.src{font-size:12px;color:var(--sub);margin:0 0 6px}
.note{font-size:12.5px;color:var(--sub);border-left:3px solid var(--line);padding-left:10px;margin-top:18px}
button.loc{font:inherit;width:100%;margin-top:12px;padding:9px;border-radius:10px;border:1px solid var(--ink);background:var(--ink);color:#fff;cursor:pointer}
.legend{background:#fff;padding:7px 10px;border-radius:8px;font-size:12px;line-height:1.7;box-shadow:0 1px 4px rgba(0,0,0,.25)}
.legend i{display:inline-block;width:14px;height:10px;margin-right:6px;vertical-align:-1px;border-radius:2px}
.vl{background:none;border:0;box-shadow:none;font-size:12px;font-weight:700;color:#1c2631;text-shadow:0 0 3px #fff,0 0 3px #fff,0 0 3px #fff}
.leaflet-tooltip.vl:before{display:none}
.leaflet-popup-content{font-family:inherit;font-size:13.5px;line-height:1.6}
@media (max-width:800px){body{grid-template-columns:1fr;grid-template-rows:auto 65vh;height:auto}html,body{height:auto}#map{height:65vh;order:-1}aside{border-right:0}}
</style>

<aside>
<h1>學區交集地圖</h1>
<p class="lead">勾選一所國小和一所國中，地圖標出同時屬於兩個學區的里。點里可看鄰別。</p>
<div id="schools"></div>
<button class="loc" id="loc">顯示我現在的位置</button>
<h2 id="rh">交集範圍</h2>
<ul id="list"></ul>
<div id="stats"></div>
<p class="note">學區以「里＋鄰」劃分，鄰界沒有公開圖資，「部分鄰」的里只能整里畫出，看房時請用門牌查鄰別再對照。里界為 2021 年簡化版，邊緣有誤差。學校標記為約略位置。資料來源：臺中市教育局及各校公告，以入學當年公告為準。</p>
</aside>

const checked=new Set(D.defaults||D.schools.map(s=>s.name));
const sel=()=>D.schools.filter(s=>checked.has(s.name));
function fmt(a){const r=[];for(let i=0;i<a.length;i++){let j=i;while(j+1<a.length&&a[j+1]===a[j]+1)j++;r.push(j>i?a[i]+'–'+a[j]:''+a[i]);i=j;}return '第'+r.join('、')+'鄰';}
function status(id){const ss=sel(),inn=ss.filter(s=>s.zones[id]);if(!ss.length||!inn.length)return{k:'none',inn};
 if(inn.length===ss.length){let set=null;for(const s of inn){const z=s.zones[id];if(!z.w){set=set?set.filter(x=>z.l.includes(x)):z.l.slice();}}
  if(set===null)return{k:'full',inn,all:true};if(!set.length)return{k:'some',inn,nolap:true};return{k:'part',inn,all:true,l:set};}
 return{k:'some',inn};}
function style(f){const st=status(f.properties.id);
 if(st.k==='full')return{color:'#8a5f00',weight:2.5,fillColor:HIT,fillOpacity:.55};
 if(st.k==='part')return{color:'#b37a00',weight:2.5,dashArray:'6 5',fillColor:HIT,fillOpacity:.22};
 if(st.k==='some')return{color:color(st.inn[0]),weight:1.5,fillColor:color(st.inn[0]),fillOpacity:.18};
 return{color:'#7a8794',weight:.8,fillOpacity:0};}
function popup(id,town,name){const st=status(id);const head=st.k==='full'?'整里都在交集內':st.k==='part'?'交集鄰別：'+fmt(st.l)+'（請用門牌確認鄰別）':st.nolap?'兩校都有涵蓋這個里，但鄰別沒有重疊':st.k==='some'?'只符合其中一所學校':'不在所選學區內';
 return `<b>${town} ${name}</b><br><span style="color:#5b6875">${head}</span>`+sel().map(s=>{const z=s.zones[id];return `<br>${s.name}：${z?(z.w?'全里':'部分')+(z.n?'（'+z.n+'）':''):'不在學區內'}`;}).join('');}
const layers={};
const geo=L.geoJSON(D.villages,{style,onEachFeature:(f,l)=>{const p=f.properties;layers[p.id]=l;
 l.bindTooltip(p.name.replace('里',''),{permanent:true,direction:'center',className:'vl'});
 l.on('click',e=>l.bindPopup(popup(p.id,p.town,p.name)).openPopup(e.latlng));}}).addTo(map);
for(const s of D.schools)L.circleMarker(s.pt,{radius:8,color:'#fff',weight:2,fillColor:color(s),fillOpacity:1}).addTo(map).bindTooltip(s.name,{permanent:true,direction:'right',offset:[8,0]});
let lgDiv;const lg=L.control({position:'bottomright'});lg.onAdd=()=>{lgDiv=L.DomUtil.create('div','legend');return lgDiv;};lg.addTo(map);
function drawLegend(){lgDiv.innerHTML=`<div><i style="background:${HIT};opacity:.8"></i>整里都在交集</div><div><i style="border:1.5px dashed ${HIT}"></i>部分鄰在交集</div>`+sel().map(s=>`<div><i style="background:${color(s)};opacity:.35"></i>只在${s.name}</div>`).join('');}
for(const kind of ['國小','國中']){const h=document.createElement('div');h.className='grp';h.textContent=kind;document.getElementById('schools').appendChild(h);
 for(const s of D.schools.filter(x=>x.kind===kind)){const l=document.createElement('label');l.className='school';
 l.innerHTML=`<input type="checkbox" ${checked.has(s.name)?'checked':''}><span class="sw" style="background:${color(s)}"></span><b>${s.name}</b>`;
 l.querySelector('input').onchange=e=>{e.target.checked?checked.add(s.name):checked.delete(s.name);render(true);};document.getElementById('schools').appendChild(l);}}
function render(fit){geo.setStyle(style);drawLegend();drawStats();const ss=sel();const hits=D.villages.features.filter(f=>status(f.properties.id).all);
 document.getElementById('rh').textContent=ss.length>1?'交集：'+ss.map(s=>s.name).join(' + '):ss.length?ss[0].name+' 學區':'請先勾選學校';
 hits.sort((a,b)=>(status(a.properties.id).k==='full'?0:1)-(status(b.properties.id).k==='full'?0:1));
 const ul=document.getElementById('list');ul.innerHTML='';
 for(const f of hits){const p=f.properties,k=status(p.id).k;const li=document.createElement('li');
  const st2=status(p.id);li.innerHTML=`${p.town} ${p.name}<span class="tag ${k}">${k==='full'?'整里':'部分鄰'}</span>`+(k==='part'?`<div style="font-size:12.5px;color:#5b6875">${fmt(st2.l)}</div>`:'');
  li.onclick=()=>{const l=layers[p.id];map.fitBounds(l.getBounds(),{padding:[40,40],maxZoom:16});l.bindPopup(popup(p.id,p.town,p.name)).openPopup(l.getBounds().getCenter());};ul.appendChild(li);}
 if(!hits.length){const li=document.createElement('li');li.style.cursor='default';li.style.color='#5b6875';li.textContent=ss.length?'這幾所學校的學區沒有重疊的里。':'先勾選學校。';ul.appendChild(li);}
 if(fit&&hits.length)map.fitBounds(L.featureGroup(hits.map(f=>layers[f.properties.id])).getBounds(),{padding:[30,30]});}
function tier(c){return c>=10?'大型（每年10班以上）':c>=6?'中型（6–9班）':'小型（5班以下）';}
function drawFresh(){const es=sel().filter(x=>x.kind==='國小');if(!es.length)return '';
 return '<h2>國小新生入學人數</h2>'+es.map(s=>{if(!s.fresh||!s.fresh.length)return `<table class="st"><caption>${s.name}</caption><tr><td style="text-align:left;color:#5b6875">尚未取得資料</td></tr></table>`;
  const latest=s.fresh[0];return `<table class="st"><caption>${s.name}<span style="font-weight:400;color:#5b6875">　${tier(latest[1])}</span></caption><tr><th>入學年度</th><th>一年級班數</th><th>新生人數</th></tr>`+
  s.fresh.map(([y,c,n,e])=>`<tr><td>${y}${e?'*':''}</td><td>${c}</td><td>${n}</td></tr>`).join('')+(()=>{const a=s.fresh.find(r=>r[0]===110),b=s.fresh.find(r=>r[0]===114);if(!a||!b)return '';const ch=(b[2]/a[2]-1)*100,cc=(D.cityFresh['114']/D.cityFresh['110']-1)*100;return `<tr><td colspan="3" style="text-align:left;color:#5b6875">110→114 年變化 ${ch.toFixed(1)}%（全市公立國小 ${cc.toFixed(1)}%）</td></tr>`;})()+'</table>';}).join('')+
 '<p class="src">新生人數＝該學年一年級學生數。下降幅度比全市小，代表學區相對熱門或有人移入；下降比全市多，可能是學區內年輕家庭變少（例如房價高、社區老化），不一定代表學校不好。資料來源：教育部統計處「國民小學校別資料」110–114 學年；115 學年取自臺中市教育局學校資料。</p>';}
function drawStats(){const js=sel().filter(x=>x.stats);const el=document.getElementById('stats');
 const fr=drawFresh();if(!js.length){el.innerHTML=fr;return;}
 el.innerHTML=fr+'<h2>國中錄取台中一中、女中人數</h2>'+js.map(s=>`<table class="st"><caption>${s.name}</caption><tr><th>年度</th><th>一中</th><th>女中</th><th>合計</th><th>畢業生</th><th>比率</th></tr>`+
 s.stats.map(([y,a,b,g,tt])=>tt!=null?`<tr><td>${y}</td><td>–</td><td>–</td><td>${tt}</td><td>${g}</td><td>${(tt/g*100).toFixed(1)}%</td></tr>`:a==null?`<tr><td>${y}</td><td colspan="5" style="text-align:left;color:#5b6875">未列入統計（可能為 0 人或沒有公布）</td></tr>`:`<tr><td>${y}</td><td>${a}</td><td>${b}</td><td>${a+b}</td><td>${g}</td><td>${((a+b)/g*100).toFixed(1)}%</td></tr>`).join('')+'</table>').join('')+
 '<p class="src">只統計會考免試入學管道，未含特色招生、體育班等其他管道。「–」代表來源只公布合計。資料整理自「雪莉的數位生活」部落格及各校榜單，僅供參考。</p>';}
render(true);
let me=null;
document.getElementById('loc').onclick=()=>{if(!navigator.geolocation){alert('這個瀏覽器不支援定位。');return;}
 navigator.geolocation.getCurrentPosition(p=>{const ll=[p.coords.latitude,p.coords.longitude];if(me)me.remove();
  me=L.circleMarker(ll,{radius:9,color:'#fff',weight:3,fillColor:'#d93025',fillOpacity:1}).addTo(map).bindTooltip('我的位置');map.setView(ll,16);},
  ()=>alert('無法取得位置，請確認已允許瀏覽器使用定位。'),{enableHighAccuracy:true});};
</script>
</body>
</html>
